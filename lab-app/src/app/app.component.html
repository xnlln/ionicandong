<ion-app><ion-split-pane contentId="main-content" when="lg">
<ion-menu contentId="main-content" type="overlay"><ion-header class="ion-no-border"><ion-toolbar><ion-title>Menu</ion-title></ion-toolbar></ion-header><ion-content><ion-list lines="none">
@for(page of pages; track page.url) { <ion-menu-toggle [autoHide]="false"><ion-item [routerLink]="page.url" routerDirection="root" routerLinkActive="selected" [detail]="false"><ion-icon slot="start" [name]="page.icon" aria-hidden="true"></ion-icon><ion-label>{{page.title}}</ion-label><ion-icon slot="end" name="chevron-forward-outline" aria-hidden="true"></ion-icon></ion-item></ion-menu-toggle> }
</ion-list></ion-content></ion-menu><ion-router-outlet id="main-content"></ion-router-outlet></ion-split-pane></ion-app>
