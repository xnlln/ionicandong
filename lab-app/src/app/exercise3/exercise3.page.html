<ion-header [translucent]="true" class="ion-no-border">
  <ion-toolbar><ion-title>HEADER</ion-title></ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <main>
    <ion-button expand="block" (click)="scrollToBottom()">Scroll to Bottom</ion-button>
    <h1>Click on the buttons to<br>scroll the content</h1>
    <p *ngFor="let paragraph of paragraphs">{{ paragraph }}</p>
    <ion-button expand="block" (click)="scrollToTop()">Scroll to Top</ion-button>
  </main>
</ion-content>

<ion-footer [translucent]="true" class="ion-no-border">
  <ion-toolbar>
    <ion-title>FOOTER</ion-title>
    <ion-buttons slot="end"><ion-button routerLink="/exercises">All Exercises</ion-button></ion-buttons>
  </ion-toolbar>
</ion-footer>
